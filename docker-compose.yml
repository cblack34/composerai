services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    # Published on loopback. The process still listens on all interfaces inside the network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COMPOSERAI_PROJECT_ROOT: /projects
      COMPOSERAI_ARCHIVE_ROOT: /archive
      COMPOSERAI_MODEL: "${COMPOSERAI_MODEL:-xai:grok-4.7}"
      COMPOSERAI_SEARCH_MODEL: "${COMPOSERAI_SEARCH_MODEL:-xai:grok-4.7}"
      COMPOSERAI_PROJECT_NAME: "${COMPOSERAI_PROJECT_NAME:-demo}"
      COMPOSERAI_MIDI_LLM_URL: http://midi-llm:8000
      XAI_API_KEY: "${XAI_API_KEY:-}"
    volumes:
      - ./projects:/projects
      - ./archive:/archive
  web:
    build:
      context: apps/web
    # Vite dev server. Open http://localhost:5173
    # Published on loopback. The process still listens on all interfaces inside the network.
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
  midi-llm:
    build:
      context: services/midi-llm
    # Published on loopback. Weights download into the named volume, not the image.
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - midi-llm-weights:/cache/huggingface

volumes:
  midi-llm-weights:
